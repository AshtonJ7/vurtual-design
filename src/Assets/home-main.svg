<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Animated drawing of a straight-on desktop monitor with a black screen</title>
<desc>A desktop monitor illustrated front-on, on a white background, drawn stroke by stroke with the screen filling in solid black, then looping.</desc>
<style>
.draw { fill: none; stroke: #b8b8b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.body { stroke-dasharray: 1600; stroke-dashoffset: 1600; fill: #f5f5f5; animation: dashbody 14s ease-in-out infinite; }
.screenline { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: dashscreen 14s ease-in-out infinite; }
.screenfill { fill: #111111; opacity: 0; animation: fillscreen 14s ease-in-out infinite; }
.chin { fill: #e2e2e2; opacity: 0; animation: chinfade 14s ease-in-out infinite; }
.stand { stroke-dasharray: 340; stroke-dashoffset: 340; fill: #e6e6e6; animation: dashstand 14s ease-in-out infinite; }
.camera { fill: #555555; opacity: 0; animation: camerafade 14s ease-in-out infinite; }
@keyframes dashbody { 0% { stroke-dashoffset: 1600; } 26% { stroke-dashoffset: 0; } 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1600; } }
@keyframes dashscreen { 0% { stroke-dashoffset: 1400; } 30% { stroke-dashoffset: 1400; } 50% { stroke-dashoffset: 0; } 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1400; } }
@keyframes fillscreen { 0% { opacity: 0; } 52% { opacity: 0; } 60% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes chinfade { 0% { opacity: 0; } 60% { opacity: 0; } 66% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes dashstand { 0% { stroke-dashoffset: 340; } 66% { stroke-dashoffset: 340; } 80% { stroke-dashoffset: 0; } 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 340; } }
@keyframes camerafade { 0% { opacity: 0; } 80% { opacity: 0; } 88% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
</style>
<g transform="translate(340,230)">
<rect x="-224" y="-154" width="468" height="330" rx="16" fill="#000000" opacity="0.06" transform="translate(8,10)"/>
<rect class="draw body" x="-230" y="-160" width="460" height="320" rx="14"/>
<rect class="draw screenline" x="-214" y="-146" width="428" height="250" rx="6"/>
<rect class="chin" x="-214" y="104" width="428" height="44" rx="6"/>
<circle class="camera" cx="0" cy="-150" r="3.5"/>
<path class="draw stand" d="M -32,160 L 32,160 L 18,232 L -18,232 Z M -70,232 L 70,232 L 70,246 L -70,246 Z" fill="#e6e6e6"/>
<g class="screenfill">
  <clipPath id="screen-clip">
    <rect x="-214" y="-146" width="428" height="250" rx="6" />
  </clipPath>

  <g clip-path="url(#screen-clip)">
    <!-- Dark App Bar -->
    <rect x="-214" y="-146" width="428" height="28" fill="#1e293b"/>
    <circle cx="-198" cy="-132" r="3.5" fill="#ef4444"/>
    <circle cx="-186" cy="-132" r="3.5" fill="#f59e0b"/>
    <circle cx="-174" cy="-132" r="3.5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="-150" y="-138" width="220" height="12" rx="4" fill="#0f172a"/>

    <!-- Wireframe Dashboard Layout -->
    <!-- Sidebar -->
    <rect x="-214" y="-118" width="80" height="222" fill="#0f172a"/>
    <rect x="-200" y="-100" width="50" height="8" rx="2" fill="#334155"/>
    <rect x="-200" y="-80" width="50" height="8" rx="2" fill="#38bdf8"/>
    <rect x="-200" y="-60" width="50" height="8" rx="2" fill="#334155"/>

    <!-- Dashboard Main Cards -->
    <rect x="-120" y="-100" width="150" height="80" rx="6" fill="#1e293b"/>
    <rect x="40" y="-100" width="150" height="80" rx="6" fill="#1e293b"/>
    <rect x="-120" y="-8" width="310" height="100" rx="6" fill="#1e293b"/>
  </g>
</g>
</g>
</svg>
